services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: leetcode-preparation:local
    restart: unless-stopped
    ports:
      - "${APP_PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-leetcode}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}@db:5432/${POSTGRES_DB:-leetcode}
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-leetcode}
      POSTGRES_USER: ${POSTGRES_USER:-leetcode}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    volumes:
      - leetcode_postgres_data:/var/lib/postgresql
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U $${POSTGRES_USER:-leetcode} -d $${POSTGRES_DB:-leetcode}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  leetcode_postgres_data: